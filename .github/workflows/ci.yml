name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v
      - name: Integration test (real Iceberg table via SQL catalog, no Docker)
        run: go test -tags=integration ./internal/metrics/... -run TestAnalyzeSkew_RealTable -v
      - name: Integration test (REST catalog client over real HTTP)
        run: go test -tags=integration ./internal/catalog/... -run TestRESTCatalog_LoadTable_RealHTTP -v
